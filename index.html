    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://beingadil.github.io https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="description" content="Offline-first dental laboratory case, lab, billing, reporting, and notification management system." />
    <meta property="og:title" content="Dental Solutions Web" />
    <meta property="og:description" content="Offline-first dental laboratory case, lab, billing, reporting, and notification management system." />
