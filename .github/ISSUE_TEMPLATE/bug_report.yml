name: Bug report
description: Something in Dental Solutions behaves incorrectly
title: ''
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not include real patient information, clinic records, or
        payment details.** Use synthetic data — the demo fixtures are the
        reference. If a report involves patient or money data, describe the shape
        of the problem only.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the sidebar footer, e.g. v2.28.2
      placeholder: v2.28.2
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Where did you see it?
      options:
        - Web build (browser)
        - Windows desktop app
        - Both
    validations:
      required: true

  - type: textarea
    id: what-did-you-do
    attributes:
      label: What did you do?
      description: The steps that lead to the problem
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, including any error message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Which area of the app is this in?
      description: e.g. Dashboard, Dental Workstation, Billing & Invoices, Price List & Catalog, Analytics & Reports, System Settings
      placeholder: Billing & Invoices

  - type: checkboxes
    id: checks
    attributes:
      label: Anything else?
      options:
        - label: This affects patient records or money
        - label: The app became slow or unresponsive
        - label: I can reproduce it every time
