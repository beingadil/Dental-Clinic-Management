name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Tag pushes are never cancelled in flight: half a release (a release
  # without its assets, or a stale manifest) is worse than two runs for the
  # same tag. Branch pushes keep cancel-on-supersede.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ---- Fast checks: typecheck + tests + web production build ----
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      # The design checks come BEFORE the build ON PURPOSE. All of them read
      # the Tailwind source, not dist/, so none of them needs the bundle —
      # putting them first proves it and keeps a Vite/PostCSS failure from
      # being misread as a contrast failure.
      #
      # The role primitives (--color-ink-*, --color-fill-*) AND the utility
      # alias rules that wire them are both GENERATED by
      # scripts/role-picker.mjs. Hand-editing either is how they drifted apart
      # in the first place, and a drifted alias is not cosmetic: the utility
      # falls through to the raw Tailwind palette and the solved token never
      # paints, so the audit below would grade a colour that is not on screen.
      - name: Role primitives match the solver (no hand-edited tokens/aliases)
        run: npm run role:check

      # WCAG AA pairing audit over every bg>text combination the app really
      # renders, in both themes and in every interaction state. It reads the
      # light palette out of the Tailwind SOURCE (theme.css + the project's own
      # @theme blocks), not dist/, so it cannot grade a stale bundle.
      #
      # The report is written to a file as well as stdout, and uploaded whether
      # or not the check passed: a green run is still the record of which
      # pairings were graded, which is what makes a later red run diagnosable.
      - name: Contrast audit (WCAG AA, both themes, all states)
        shell: bash
        # pipefail is REQUIRED: piping into `tee` without it reports tee's exit
        # code, so a failing audit would read as a passing step.
        run: |
          set -o pipefail
          node scripts/contrast-audit.mjs | tee contrast-audit.txt

      - name: Upload contrast audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-audit-report
          path: contrast-audit.txt
          retention-days: 14

      # The audit above only grades a bg and a text utility that appear in the
      # SAME className. The commonest real defect is the one it structurally
      # cannot see: a parent paints the dark bar, a child sets the ink. This
      # second scan walks the JSX tree instead of the line, so it resolves
      # inherited backgrounds — it is what caught the ink-on-dark-header sites
      # in the detail modals. Both audits pass; they cover different surfaces.
      - name: Ink on inherited dark bar (ancestor-aware scan)
        run: node scripts/find-darkbar-ink.mjs

      - name: Web production build
        run: npm run build

      # Only here, because it is the one check that genuinely needs the
      # bundle: it compares the source-derived palette against what Tailwind
      # actually compiled. That comparison is what licenses the three checks
      # above to skip the build.
      - name: Source palette matches the compiled bundle
        run: node scripts/palette-equivalence.mjs

  # ---- Dependency vulnerability scan ----
  # Added after an audit found four live advisories in rustls (the TLS library
  # reqwest uses to download updates) that no existing job would ever have
  # reported. Both ecosystems are scanned because both ship: npm covers the
  # bundled frontend, cargo covers the binary that actually touches patient
  # data and the network.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # Dev dependencies are included on purpose: they run on the build
        # machine that produces the artifact, so a compromised build-time
        # package reaches production just as effectively as a runtime one.
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Run as an explicit install+invoke rather than through
      # rustsec/audit-check@v2.0.0. That action's real interface is `token`
      # (required), `ignore` (comma-separated) and `working-directory`; a first
      # attempt used an input called `audit-command` that does not exist, omitted
      # the required token, and left working-directory at the default `.` when
      # Cargo.lock lives in src-tauri/. All three were wrong and the job failed,
      # which blocked every release until it was read from the action's own
      # action.yml. Do not reintroduce it.
      #
      # Six advisories are ignored, each verified NOT to reach customers:
      #   RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g - glib, a Linux/GTK path of a
      #     cross-platform dependency. Zero build artefacts on windows-latest;
      #     it is never compiled into the shipped .exe.
      #   RUSTSEC-2024-0370 - proc-macro-error, a compile-time proc macro. It
      #     never exists in a shipped binary.
      #   RUSTSEC-2026-0370 / 0371 / 0372 - zvariant, zbus_names and
      #     zvariant_derive are UNMAINTAINED, not vulnerable: RustSec publishes
      #     them for crates that have been folded into a successor, and no fix
      #     version exists to move to. They are reachable only through zbus,
      #     and zbus reaches them only on Linux, via tauri-plugin-opener and
      #     tauri-plugin-single-instance. `cargo tree --target
      #     x86_64-pc-windows-msvc -i zvariant` prints "nothing to print",
      #     while the same command for rustls-webpki prints the reqwest chain
      #     the Windows build really contains. So these three are not compiled
      #     into the shipped .exe at all.
      #
      # The TLS advisories that DID reach the Windows build were fixed rather
      # than ignored: rustls-webpki 0.103.16 and webpki-roots 1.0.10, for
      # RUSTSEC-2026-0382 and RUSTSEC-2026-0381. reqwest carries rustls, and
      # reqwest is what fetches an update - a certificate path that accepts a
      #     distrusted intermediate is exactly the wrong thing to leave in the
      #     one crate that decides whether the installer you are about to run
      #     is the one you meant to run.
      #
      # Re-verify before ever removing these ignores, and do not add an
      # ignore for anything that is in the Windows dependency graph.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies (cargo audit)
        # -f points at the lockfile, since cargo audit reads ./Cargo.lock by
        # default and ours is in src-tauri/.
        run: |
          cargo audit -f src-tauri/Cargo.lock \
            --ignore RUSTSEC-2024-0429 \
            --ignore GHSA-wrw7-89jp-8q8g \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372

      - name: Assert Linux-only crates are absent from the Windows graph
        # The ignores above are conditional on these crates never being
        # compiled for Windows — but nothing enforced that condition, so a
        # future dependency that reaches them on Windows would inherit a
        # silent pass. This step IS the enforcement: it runs the three cargo
        # tree queries the justifications are based on and fails the job if
        # any of them starts printing a dependency chain. `--target
        # x86_64-pc-windows-msvc -i <pkg>` prints "nothing to print" when the
        # package is not in that graph (verified locally on this repo).
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pkg in zvariant glib zbus_names; do
            echo "--- cargo tree --target x86_64-pc-windows-msvc -i $pkg"
            out="$(cargo tree --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -i "$pkg" 2>&1 || true)"
            echo "$out"
            if ! printf '%s' "$out" | grep -qi 'nothing to print'; then
              echo "::error::$pkg is now reachable from the Windows dependency graph — the cargo-audit ignore for it is no longer justified. Fix the dependency chain or re-evaluate the advisory before merging."
              fail=1
            fi
          done
          exit $fail

  # ---- Desktop installer: real Tauri build (NSIS) on Windows ----
  # Runs only after the web and security jobs pass. Produces downloadable
  # artifacts on every run so a clinic PC can install without a local Rust
  # toolchain. `security` is a hard dependency on purpose: an unsigned,
  # un-audited artifact should never reach a clinic's machine.
  desktop:
    needs: [web, security]
    runs-on: windows-latest
    timeout-minutes: 45
    # The release step below creates a GitHub Release on v* tags.
    permissions:
      contents: write
    # Code signing activates only when the certificate secrets exist (see the
    # "Sign the NSIS installer" step). Secrets cannot be referenced in
    # step-level `if:` expressions, so the boolean is computed once here:
    # when the secrets are absent the sign step is skipped and the release
    # ships unsigned, exactly as before.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag must match the built version
        # The installer is built from package.json + tauri.conf.json + Cargo.toml.
        # A tag that disagrees with any of them would publish a manifest whose
        # download_url points at a file that does not exist, and the in-app
        # updater would retry it forever. Nothing else in the pipeline can
        # detect that drift, so this step is the gate.
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v') {
            Write-Host "Not a tag push ($env:GITHUB_REF_NAME) — skipping the tag/version gate."
            exit 0
          }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $ref = $env:GITHUB_REF_NAME
          if ($ref -ne "v$pkg") {
            throw "Tag $ref does not match package.json version ($pkg). Fix the version bump or the tag before this can release."
          }
          node scripts/version-guard.mjs

      - name: Install dependencies
        run: npm ci

      # The binary guard anchors to win32/x64 and SKIPS on any other host, so
      # the `web` job's `npm run lint` never actually verified anything — it
      # printed "SKIPPED" and exited 0. This job is the only place the guard can
      # do its job, so it runs here, explicitly, and fails the build if a
      # shipped native binary does not match the hash captured from the official
      # npm tarball. Without this the guard is decorative in CI and only ever
      # enforced on one developer's machine.
      - name: Binary integrity guard (win32/x64 anchor)
        run: npm run verify:binaries

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Update-chain smoke test: stage-receipt payload shape + diagnostics
      # magic filter. The missing-receipt incident (2026-09-30) produced a
      # false "close the app to install" banner; these tests fail the build
      # if the receipt contract drifts.
      - name: Rust tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri installer (NSIS)
        run: npm run tauri:build

      - name: Upload installer (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: dental-solutions-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # One selection, three consumers. The installer's disk name carries the
      # product name, the GitHub asset name normalises spaces to dots — pick
      # the file by the version it must embed, fail loudly if absent or
      # ambiguous, and let every step after this read the resolved values
      # instead of each one fishing in the folder for the "first .exe".
      - name: Resolve the tagged installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $candidates = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $match = @($candidates | Where-Object { $_.Name -like "*${version}_x64-setup.exe" })
          if ($match.Count -ne 1) {
            $found = @($candidates | ForEach-Object { $_.Name }) -join ', '
            throw "Expected exactly one NSIS installer matching *${version}_x64-setup.exe for $tag; found $($match.Count) (all: $found). Refusing to release against the wrong binary."
          }
          $exe = $match[0]
          $assetName = $exe.Name -replace ' ', '.'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "INSTALLER_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
          "ASSET_NAME=$assetName" | Out-File $env:GITHUB_ENV -Append
          "INSTALLER_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Installer: $($exe.Name)  ->  asset $assetName  sha256 $hash"

      # ---- Code signing: only when the certificate secrets are configured ----
      # Activated by adding two repository secrets: WINDOWS_PFX_BASE64 (the
      # .pfx, base64-encoded) and WINDOWS_PFX_PASSWORD. The step then signs
      # the installer with the SHA-256 Authenticode algorithm, timestamps it,
      # and verifies its own work with signtool verify /pa. A failure fails
      # the release — a half-signed binary is never uploaded. Everything
      # downstream (SHA256SUMS.txt, the uploaded asset, the update manifest)
      # is re-hashed AFTER signing so the chain describes the signed bytes.
      - name: Sign the NSIS installer (optional — activates with WINDOWS_PFX_* secrets)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'update-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          try {
            $exe = $env:INSTALLER_PATH
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found in the Windows SDK on this runner." }
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            "INSTALLER_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append
            Write-Host "Signed and re-hashed: sha256 $hash"
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # ---- GitHub Release: only when a v* tag is pushed ----
      - name: Create SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "${env:INSTALLER_SHA256}  ${env:ASSET_NAME}" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Uses the official preinstalled gh CLI (softprops/action-gh-release has
      # a known "Error creating asset temp dir" failure on Windows runners).
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = $env:INSTALLER_PATH
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Dental Solutions $tag" --verify-tag --generate-notes
          }
          gh release upload $tag $exe SHA256SUMS.txt --clobber
          # A prior failed run can leave the release as a draft (invisible to
          # the public); always ensure it ends up published.
          gh release edit $tag --draft=false

      # Publishes the auto-update manifest consumed by the in-app updater
      # (src/services/updateService.ts) to the gh-pages branch, served at a
      # stable https URL with no API rate limit. The action handles branch
      # creation and pushing; we only stage the single JSON file.
      - name: Prepare update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $assetName = $env:ASSET_NAME
          $hash = $env:INSTALLER_SHA256
          $releasedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $manifest = @{
            magic            = 'DENTALUPDATE'
            version          = $version
            channel          = 'stable'
            released_at      = $releasedAt
            download_url     = "https://github.com/beingadil/Dental-Clinic-Management/releases/download/$tag/$assetName"
            payload_checksum = "sha256:$hash"
            notes            = "Dental Solutions $tag installer"
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force pages | Out-Null
          $manifest | Out-File -Encoding ascii pages/update-manifest.json
          Get-Content pages/update-manifest.json

      - name: Publish update manifest (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages

      # peaceiris pushes the gh-pages branch and returns as soon as the push
      # is accepted — a silently failed publish (or a stale raw cache) would
      # leave every clinic on the old version with no signal. This step
      # re-fetches the manifest until it matches the tag it publishes, and
      # fails the release otherwise.
      - name: Verify the published manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $expectedChecksum = "sha256:$env:INSTALLER_SHA256"
          $url = "https://raw.githubusercontent.com/beingadil/Dental-Clinic-Management/gh-pages/update-manifest.json?v=$tag"
          $ok = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $m = Invoke-RestMethod -Uri $url -TimeoutSec 20
              if ($m.version -eq $version -and $m.payload_checksum -eq $expectedChecksum) {
                Write-Host "Manifest live at $url — version=$($m.version), payload_checksum matches the release."
                $ok = $true
                break
              }
              Write-Host "Attempt ${attempt}: manifest not updated yet (version=$($m.version)); retrying in 10s…"
            } catch {
              Write-Host "Attempt ${attempt}: fetch failed ($($_.Exception.Message)); retrying in 10s…"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            throw "The published manifest does not match $tag — clients would never see this release. Re-run the workflow."
          }
