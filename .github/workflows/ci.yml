name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Fast checks: typecheck + tests + web production build ----
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      # The design checks come BEFORE the build ON PURPOSE. All of them read
      # the Tailwind source, not dist/, so none of them needs the bundle —
      # putting them first proves it and keeps a Vite/PostCSS failure from
      # being misread as a contrast failure.
      #
      # The role primitives (--color-ink-*, --color-fill-*) AND the utility
      # alias rules that wire them are both GENERATED by
      # scripts/role-picker.mjs. Hand-editing either is how they drifted apart
      # in the first place, and a drifted alias is not cosmetic: the utility
      # falls through to the raw Tailwind palette and the solved token never
      # paints, so the audit below would grade a colour that is not on screen.
      - name: Role primitives match the solver (no hand-edited tokens/aliases)
        run: npm run role:check

      # WCAG AA pairing audit over every bg>text combination the app really
      # renders, in both themes and in every interaction state. It reads the
      # light palette out of the Tailwind SOURCE (theme.css + the project's own
      # @theme blocks), not dist/, so it cannot grade a stale bundle.
      #
      # The report is written to a file as well as stdout, and uploaded whether
      # or not the check passed: a green run is still the record of which
      # pairings were graded, which is what makes a later red run diagnosable.
      - name: Contrast audit (WCAG AA, both themes, all states)
        shell: bash
        # pipefail is REQUIRED: piping into `tee` without it reports tee's exit
        # code, so a failing audit would read as a passing step.
        run: |
          set -o pipefail
          node scripts/contrast-audit.mjs | tee contrast-audit.txt

      - name: Upload contrast audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-audit-report
          path: contrast-audit.txt
          retention-days: 14

      # The audit above only grades a bg and a text utility that appear in the
      # SAME className. The commonest real defect is the one it structurally
      # cannot see: a parent paints the dark bar, a child sets the ink. This
      # second scan walks the JSX tree instead of the line, so it resolves
      # inherited backgrounds — it is what caught the ink-on-dark-header sites
      # in the detail modals. Both audits pass; they cover different surfaces.
      - name: Ink on inherited dark bar (ancestor-aware scan)
        run: node scripts/find-darkbar-ink.mjs

      - name: Web production build
        run: npm run build

      # Only here, because it is the one check that genuinely needs the
      # bundle: it compares the source-derived palette against what Tailwind
      # actually compiled. That comparison is what licenses the three checks
      # above to skip the build.
      - name: Source palette matches the compiled bundle
        run: node scripts/palette-equivalence.mjs

  # ---- Dependency vulnerability scan ----
  # Added after an audit found four live advisories in rustls (the TLS library
  # reqwest uses to download updates) that no existing job would ever have
  # reported. Both ecosystems are scanned because both ship: npm covers the
  # bundled frontend, cargo covers the binary that actually touches patient
  # data and the network.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # Dev dependencies are included on purpose: they run on the build
        # machine that produces the artifact, so a compromised build-time
        # package reaches production just as effectively as a runtime one.
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Run as an explicit install+invoke rather than through
      # rustsec/audit-check@v2.0.0. That action's real interface is `token`
      # (required), `ignore` (comma-separated) and `working-directory`; a first
      # attempt used an input called `audit-command` that does not exist, omitted
      # the required token, and left working-directory at the default `.` when
      # Cargo.lock lives in src-tauri/. All three were wrong and the job failed,
      # which blocked every release until it was read from the action's own
      # action.yml. Do not reintroduce it.
      #
      # Three advisories are ignored, each verified NOT to reach customers:
      #   RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g - glib, a Linux/GTK path of a
      #     cross-platform dependency. Zero build artefacts on windows-latest;
      #     it is never compiled into the shipped .exe.
      #   RUSTSEC-2024-0370 - proc-macro-error, a compile-time proc macro. It
      #     never exists in a shipped binary.
      # Both were confirmed by inspecting target/release after a real build.
      # Re-verify before ever removing these ignores.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies (cargo audit)
        # -f points at the lockfile, since cargo audit reads ./Cargo.lock by
        # default and ours is in src-tauri/.
        run: |
          cargo audit -f src-tauri/Cargo.lock \
            --ignore RUSTSEC-2024-0429 \
            --ignore GHSA-wrw7-89jp-8q8g \
            --ignore RUSTSEC-2024-0370

  # ---- Desktop installers: real Tauri build (NSIS + MSI) on Windows ----
  # Runs only after the web and security jobs pass. Produces downloadable
  # artifacts on every run so a clinic PC can install without a local Rust
  # toolchain. `security` is a hard dependency on purpose: an unsigned,
  # un-audited artifact should never reach a clinic's machine.
  desktop:
    needs: [web, security]
    runs-on: windows-latest
    timeout-minutes: 45
    # The release step below creates a GitHub Release on v* tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The binary guard anchors to win32/x64 and SKIPS on any other host, so
      # the `web` job's `npm run lint` never actually verified anything — it
      # printed "SKIPPED" and exited 0. This job is the only place the guard can
      # do its job, so it runs here, explicitly, and fails the build if a
      # shipped native binary does not match the hash captured from the official
      # npm tarball. Without this the guard is decorative in CI and only ever
      # enforced on one developer's machine.
      - name: Binary integrity guard (win32/x64 anchor)
        run: npm run verify:binaries

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Update-chain smoke test: stage-receipt payload shape + diagnostics
      # magic filter. The missing-receipt incident (2026-09-30) produced a
      # false "close the app to install" banner; these tests fail the build
      # if the receipt contract drifts.
      - name: Rust tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri installers (NSIS + MSI)
        run: npm run tauri:build

      - name: Upload installer (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: dental-solutions-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # ---- GitHub Release: only when a v* tag is pushed ----
      - name: Create SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # NSIS names the file after productName ("Dental Solutions_...exe"),
          # but GitHub normalises spaces to dots when it stores a release
          # asset, so the download really exists as "Dental.Solutions_...exe".
          # Record the name as it will actually exist in the release, otherwise
          # SHA256SUMS.txt names a file that cannot be downloaded.
          $assetName = $exe.Name -replace ' ', '.'
          "$hash  $assetName" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Uses the official preinstalled gh CLI (softprops/action-gh-release has
      # a known "Error creating asset temp dir" failure on Windows runners).
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Dental Solutions $tag" --verify-tag --generate-notes
          }
          gh release upload $tag $exe SHA256SUMS.txt --clobber
          # A prior failed run can leave the release as a draft (invisible to
          # the public); always ensure it ends up published.
          gh release edit $tag --draft=false

      # Publishes the auto-update manifest consumed by the in-app updater
      # (src/services/updateService.ts) to the gh-pages branch, served at a
      # stable https URL with no API rate limit. The action handles branch
      # creation and pushing; we only stage the single JSON file.
      - name: Prepare update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $assetName = $exe.Name -replace ' ', '.'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $releasedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $manifest = @{
            magic            = 'DENTALUPDATE'
            version          = $version
            channel          = 'stable'
            released_at      = $releasedAt
            download_url     = "https://github.com/beingadil/Dental-Clinic-Management/releases/download/$tag/$assetName"
            payload_checksum = "sha256:$hash"
            notes            = "Dental Solutions $tag installer"
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force pages | Out-Null
          $manifest | Out-File -Encoding ascii pages/update-manifest.json
          Get-Content pages/update-manifest.json

      - name: Publish update manifest (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
