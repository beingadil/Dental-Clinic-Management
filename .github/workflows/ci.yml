name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Fast checks: typecheck + tests + web production build ----
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Web production build
        run: npm run build

  # ---- Desktop installers: real Tauri build (NSIS + MSI) on Windows ----
  # Runs only after the web job passes. Produces downloadable artifacts on
  # every run so a clinic PC can install without a local Rust toolchain.
  desktop:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45
    # The release step below creates a GitHub Release on v* tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri installers (NSIS + MSI)
        run: npm run tauri:build

      - name: Upload installer (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: dental-solutions-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # ---- GitHub Release: only when a v* tag is pushed ----
      - name: Create SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Uses the official preinstalled gh CLI (softprops/action-gh-release has
      # a known "Error creating asset temp dir" failure on Windows runners).
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Dental Solutions $tag" --verify-tag --generate-notes
          }
          gh release upload $tag $exe SHA256SUMS.txt --clobber
          # A prior failed run can leave the release as a draft (invisible to
          # the public); always ensure it ends up published.
          gh release edit $tag --draft=false

      # Publishes the auto-update manifest consumed by the in-app updater
      # (src/services/updateService.ts). Pushed to gh-pages so the manifest is
      # served at a stable https URL with no API rate limit. Safe on re-runs.
      - name: Publish update manifest (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $assetName = $exe.Name -replace ' ', '.'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $releasedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $manifest = @{
            magic            = 'DENTALUPDATE'
            version          = $version
            channel          = 'stable'
            released_at      = $releasedAt
            download_url     = "https://github.com/beingadil/Dental-Clinic-Management/releases/download/$tag/$assetName"
            payload_checksum = "sha256:$hash"
            notes            = "Dental Solutions $tag installer"
          } | ConvertTo-Json
          $manifest | Out-File -Encoding ascii update-manifest.json
          Get-Content update-manifest.json

          # Ensure the gh-pages branch exists, then commit the manifest onto it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>$null
          if ($LASTEXITCODE -ne 0) {
            git checkout --orphan gh-pages
            git rm -rf . 2>$null
          } else {
            git checkout gh-pages
          }
          Copy-Item update-manifest.json . -Force
          git add update-manifest.json
          git commit -m "update manifest $tag" 2>$null
          git push origin gh-pages
          git checkout -
