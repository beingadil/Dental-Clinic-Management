name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Fast checks: typecheck + tests + web production build ----
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Web production build
        run: npm run build

  # ---- Desktop installers: real Tauri build (NSIS + MSI) on Windows ----
  # Runs only after the web job passes. Produces downloadable artifacts on
  # every run so a clinic PC can install without a local Rust toolchain.
  desktop:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45
    # The release step below creates a GitHub Release on v* tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri installers (NSIS + MSI)
        run: npm run tauri:build

      - name: Upload installer (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: dental-solutions-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # ---- GitHub Release: only when a v* tag is pushed ----
      - name: Create SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Uses the official preinstalled gh CLI (softprops/action-gh-release has
      # a known "Error creating asset temp dir" failure on Windows runners).
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Dental Solutions $tag" --verify-tag --generate-notes
          }
          gh release upload $tag $exe SHA256SUMS.txt --clobber
          # A prior failed run can leave the release as a draft (invisible to
          # the public); always ensure it ends up published.
          gh release edit $tag --draft=false

      # Publishes the auto-update manifest consumed by the in-app updater
      # (src/services/updateService.ts) to the gh-pages branch, served at a
      # stable https URL with no API rate limit. The action handles branch
      # creation and pushing; we only stage the single JSON file.
      - name: Prepare update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $assetName = $exe.Name -replace ' ', '.'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $releasedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $manifest = @{
            magic            = 'DENTALUPDATE'
            version          = $version
            channel          = 'stable'
            released_at      = $releasedAt
            download_url     = "https://github.com/beingadil/Dental-Clinic-Management/releases/download/$tag/$assetName"
            payload_checksum = "sha256:$hash"
            notes            = "Dental Solutions $tag installer"
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force pages | Out-Null
          $manifest | Out-File -Encoding ascii pages/update-manifest.json
          Get-Content pages/update-manifest.json

      - name: Publish update manifest (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages

  # ---- Post-release verification: fail loudly if the release did not serve ----
  # Runs only for v* tags, after the desktop job published everything. Checks
  # what the in-app updater will actually consume: manifest version, manifest
  # checksum vs the uploaded asset, asset present, release not a draft.
  # Born from the v2.12.0 update-loop incident — see LOOPS.md
  # (Post-Release Verify & Settle).
  verify-release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release served end-to-end
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          fail() { echo "::error::verify-release: $1"; exit 1; }

          # 1. Release exists, is published, and carries the installer asset.
          gh release view "$TAG" --json isDraft,assets \
            --jq '{draft: .isDraft, exe: [.assets[] | select(.name | test("setup\\.exe$"))] | length}' \
            > rel.json
          grep -q '"draft":false' rel.json || fail "release $TAG is a draft (or missing)"
          grep -q '"exe":1' rel.json || fail "release $TAG has no NSIS setup exe attached"

          # 2. Live manifest must report this version and a download_url pointing at this tag.
          # Pages propagation races the publish step: poll up to 3x with a 20s
          # backoff before declaring failure (a single 30s sleep failed v2.12.2
          # spuriously while every artifact was actually green).
          fetch_manifest() {
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/update-manifest.json" -o manifest.json
          }
          ok=0
          for attempt in 1 2 3; do
            if fetch_manifest && grep -q "\"version\": \"$VERSION\"" manifest.json; then
              ok=1
              break
            fi
            echo "manifest attempt $attempt not ready (missing or stale version) — retrying in 20s"
            sleep 20
          done
          [ "$ok" = "1" ] || fail "gh-pages update-manifest.json never reported $VERSION after 3 attempts — updater would fall back to the API"
          grep -q "releases/download/$TAG/" manifest.json \
            || fail "manifest download_url does not point at $TAG"

          # 3. Manifest checksum must match the actual asset bytes (what update_install verifies).
          MANIFEST_SHA=$(grep -o '"payload_checksum": "sha256:[a-f0-9]*"' manifest.json | cut -d: -f2 | tr -d '"')
          [ -n "$MANIFEST_SHA" ] || fail "manifest has no payload_checksum"
          ASSET_URL=$(grep -o '"download_url": "[^"]*"' manifest.json | cut -d'"' -f4)
          curl -fsSL "$ASSET_URL" -o setup.exe || fail "installer asset not downloadable: $ASSET_URL"
          ACTUAL_SHA=$(sha256sum setup.exe | cut -d' ' -f1)
          [ "$MANIFEST_SHA" = "$ACTUAL_SHA" ] \
            || fail "checksum mismatch: manifest says $MANIFEST_SHA, asset bytes are $ACTUAL_SHA — every install would abort"

          echo "verify-release: OK — $TAG serves manifest version $VERSION with matching checksum."
