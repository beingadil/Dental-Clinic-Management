[package]
name = "dental-solutions"
version = "2.3.2"
edition = "2021"

[lib]
name = "dental_solutions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
tauri-plugin-opener = "2"
sha2 = "0.10"
hex = "0.4"
# Streaming HTTPS downloads for the auto-update engine (no OpenSSL — rustls keeps
# the Windows build toolchain-free). "stream" gives access to Response::bytes_stream.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
