[package]
name = "dental-solutions"
version = "2.12.1"
edition = "2021"

[lib]
name = "dental_solutions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
tauri-plugin-opener = "2"
sha2 = "0.10"
hex = "0.4"
# Streaming HTTPS downloads for the auto-update engine (no OpenSSL — rustls keeps
# the Windows build toolchain-free). "stream" gives access to Response::bytes_stream.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tauri-plugin-dialog = "2.8.0"
windows-core = "0.62"
# Windows registry read (HKCU InstallLocation) for the update relaunch target.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Save-as-PDF: drive WebView2's PrintToPdfStream through the platform webview.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
